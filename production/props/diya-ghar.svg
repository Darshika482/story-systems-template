<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" data-prop="diya-ghar">
  <title>घर का दीया — diya-ghar</title>
  <desc>Small brass lamp used at home: round foot, short stem with one knob, shallow cup with a spout to the right, a ring handle at the back that is bent slightly out of round, a dent in the cup, a dried oil streak under the spout. The flame is the shared one from lau.svg, wick tip at 312,218, the same point as in diya-jaipur.svg. States left to right: lit, unlit.</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .sh{fill:#4A2C20;opacity:.16}
    .hl{fill:#FCFAF4;opacity:.5}
    .f-brass{fill:#C4932F}
    .f-flame-core{fill:#FFE9A6}
    .s-outline{stroke:#4A2C20}
    .s-brass{stroke:#C4932F}
    .s-cotton-white{stroke:#FCFAF4}
    .s-soot-black{stroke:#2A2321}
    .c-flame-core{stop-color:#FFE9A6}
    .c-lamp-gold{stop-color:#F5A623}
  </style>
  <defs>
    <radialGradient id="diya-ghar-fire" cx=".5" cy=".7" r=".62">
      <stop offset="0" class="c-flame-core"/>
      <stop offset=".5" class="c-lamp-gold"/>
      <stop offset="1" class="c-lamp-gold"/>
    </radialGradient>
    <radialGradient id="diya-ghar-halo">
      <stop offset="0" class="c-lamp-gold" stop-opacity=".5"/>
      <stop offset="1" class="c-lamp-gold" stop-opacity="0"/>
    </radialGradient>
    <!-- The one drawing of the lamp, without flame. -->
    <g id="diya-ghar-body">
      <ellipse class="sh" cx="216" cy="344" rx="74" ry="6"/>
      <!-- ring handle, bent -->
      <ellipse class="n s-outline" stroke-width="10" cx="126" cy="246" rx="15" ry="12" transform="rotate(-18 126 246)"/>
      <ellipse class="n s-brass" stroke-width="5" cx="126" cy="246" rx="15" ry="12" transform="rotate(-18 126 246)"/>
      <!-- foot and stem -->
      <path class="f-brass o" d="M160 330 C160 322 186 318 214 318 C242 318 268 322 268 330 C268 338 242 343 214 343 C186 343 160 338 160 330 Z"/>
      <path class="f-brass o" d="M184 322 C196 312 204 302 206 292 L222 292 C224 302 232 312 244 322 C232 328 196 328 184 322 Z"/>
      <ellipse class="f-brass o" cx="214" cy="286" rx="17" ry="9"/>
      <path class="f-brass o" d="M204 278 L207 264 L221 264 L224 278 Z"/>
      <path class="sh" d="M207 264 L221 264 L224 278 L204 278 Z"/>
      <!-- cup -->
      <path class="f-brass o" d="M134 236 C136 254 170 268 214 268 C250 268 274 258 284 246 L320 224 C316 217 302 215 288 219 C268 212 150 214 134 236 Z"/>
      <path class="sh" style="opacity:.3" d="M140 236 C158 220 262 218 284 224 L312 221 C302 228 292 232 284 236 C262 248 156 250 140 236 Z"/>
      <path class="f-brass" opacity=".7" d="M154 238 C172 229 250 228 266 234 C250 246 172 247 154 238 Z"/>
      <path class="d" d="M140 236 C156 250 262 248 284 236 C294 232 304 227 314 222"/>
      <!-- polish, dent, dried oil under the spout, tarnish on the foot -->
      <path class="hl" d="M156 252 C176 260 200 263 222 262 C200 258 176 254 156 248 Z"/>
      <path class="hl" d="M172 327 C186 323 204 322 222 322 C204 325 186 327 172 331 Z"/>
      <ellipse class="sh" cx="252" cy="256" rx="9" ry="5" transform="rotate(-24 252 256)"/>
      <path class="sh" style="opacity:.34" d="M296 236 C304 232 312 228 318 226 C314 238 306 248 296 256 C292 250 292 242 296 236 Z"/>
      <path class="sh" d="M236 336 C250 334 262 332 268 330 C268 338 250 342 228 343 Z"/>
      <!-- wick -->
      <path class="n s-outline" stroke-width="8" d="M244 236 C268 236 292 228 311 221"/>
      <path class="n s-cotton-white" stroke-width="5" d="M244 236 C268 236 292 228 311 221"/>
      <path class="n s-soot-black" stroke-width="5" d="M303 223 L311 221"/>
    </g>
    <g id="diya-ghar-lau">
      <circle cx="0" cy="-30" r="76" fill="url(#diya-ghar-halo)"/>
      <path fill="url(#diya-ghar-fire)" d="M0 0 C-15 -3 -19 -22 -9 -38 C-4 -46 0 -54 -1 -66 C9 -55 17 -42 17 -26 C17 -12 11 -2 0 0 Z"/>
      <path class="f-flame-core" d="M1 -3 C-7 -5 -9 -15 -4 -23 C-2 -27 1 -31 1 -37 C6 -31 9 -24 9 -16 C9 -9 6 -4 1 -3 Z"/>
    </g>
  </defs>

  <g id="state-lit" data-state="diya-ghar:lit">
    <use href="#diya-ghar-body"/>
    <use href="#diya-ghar-lau" transform="translate(312 218) scale(1.25)"/>
  </g>

  <g id="state-unlit" data-state="diya-ghar:unlit" transform="translate(400 0)">
    <use href="#diya-ghar-body"/>
  </g>
</svg>
