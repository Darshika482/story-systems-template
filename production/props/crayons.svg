      <ellipse class="sh" cx="204" cy="318" rx="170" ry="8"/>
      <path class="f-cane-straw o" d="M44 120 H356 V310 H44 Z"/>
      <path class="sh" d="M44 120 H356 V310 H44 Z"/>
    </g>
    <g id="crayons-tray-front">
      <path class="f-cane-straw o" d="M40 248 H360 V310 Q360 314 356 314 H44 Q40 314 40 310 Z"/>
      <path class="f-kite-pink" d="M41.500 262 H358.500 V274 H41.500 Z"/>
      <path class="d" opacity=".5" d="M41.500 262 H358.500 M41.500 274 H358.500"/>
      <path class="f-paper-cream ot" opacity=".9" d="M330 244 l34 6 l-4 22 l-34 -6 Z"/>
    </g>
  </defs>

  <g id="state-ordered" data-state="crayons:ordered">
