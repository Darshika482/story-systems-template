<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" data-prop="crayons">
  <title>अनाया के क्रेयॉन — twelve crayons in strict order</title>
  <desc>Twelve wax crayons standing in an open card tray. The order never changes, screen-left to screen-right: red, orange, yellow, light green, dark green, sky, blue, indigo, pink, brown, black, white. Each crayon is a palette token, so the tray is also the film's colour chart. Wear: the red is worn down to a stub, the white is almost new; the tray has one corner mended with tape. States left to right: ordered, one-out (the pink one lies in front of the tray and its place stands empty: the thing she cannot bear).</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .ot{stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .sh{fill:#4A2C20;opacity:.16}
    .hl{fill:#FCFAF4;opacity:.5}
    .f-cane-straw{fill:#CFAE74}
    .f-paper-cream{fill:#FFF8E4}
    .f-wool-red{fill:#D2312E}
    .f-terracotta{fill:#C66B3F}
    .f-haldi-yellow{fill:#EDB82F}
    .f-leaf-green{fill:#6B9B3A}
    .f-bench-green{fill:#2F6D54}
    .f-day-sky{fill:#CDE6F0}
    .f-phone-blue{fill:#4DA3F0}
    .f-night-indigo{fill:#1F2348}
    .f-kite-pink{fill:#EF6FA1}
    .f-wood{fill:#9A683C}
    .f-soot-black{fill:#2A2321}
    .f-cotton-white{fill:#FCFAF4}
  </style>
