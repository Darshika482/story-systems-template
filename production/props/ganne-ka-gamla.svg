    <path class="d" d="M161 472 q-2 7 0 14"/>
    <path class="f-leaf-green ot" d="M158 473 q4 -8 8 0 Z"/>
    <use href="#gamla-pot"/>
    <path class="d" opacity=".5" d="M120 486 q4 -4 8 0 M194 486 q4 -4 8 0"/>
  </g>

  <g id="state-1-sprout" data-state="gamla:1-sprout" transform="translate(960 0)">
    <path class="f-leaf-green o" d="M154 488 C154 462 158 446 162 434 C166 448 168 464 166 488 Z"/>
    <path class="f-leaf-green o" d="M157 474 C146 462 136 456 122 456 C134 462 146 472 155 482 Z"/>
