<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 640" data-prop="ganne-ka-gamla">
  <title>गन्ने का गमला — the sunflower's pot, then the cane's</title>
  <desc>One terracotta pot, drawn once: 30 cm tall, rolled rim, a white painted band under the rim. Scale: 1 cm = 4 units; floor line y=610; every state is at the same scale so the growth can be read across the row. Wear: two chips in the white band, one dried white drip below it, a hairline crack down from the rim on the screen-right side, salt bloom near the foot. States left to right: surajmukhi (chapters 2 and 3), kana-ganna (the blemished length from the cart, scene 4.4), 0-node (planted, scene 4.5), 1-sprout (chapter 5), 2-knee (chapter 6), 3-waist (chapter 7), 4-tall (epilogue: taller than अनाया's pencil mark). The dashed line and ticks in the last cell are the door-frame guide, not part of the prop.</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .ot{stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:5 5;opacity:.5}
    .n{fill:none}
    .sh{fill:#4A2C20;opacity:.16}
    .hl{fill:#FCFAF4;opacity:.5}
    .f-terracotta{fill:#C66B3F}
    .f-cotton-white{fill:#FCFAF4}
    .f-paper-cream{fill:#FFF8E4}
    .f-wood{fill:#9A683C}
    .f-leaf-green{fill:#6B9B3A}
    .f-haldi-yellow{fill:#EDB82F}
    .f-cane-straw{fill:#CFAE74}
    .f-rust-shawl{fill:#B5532B}
    .f-soot-black{fill:#2A2321}
    .s-outline{stroke:#4A2C20}
    .s-leaf-green{stroke:#6B9B3A}
    .cane-o{fill:none;stroke:#4A2C20;stroke-linecap:butt}
    .cane{fill:none;stroke:#CFAE74;stroke-linecap:butt}
  </style>
  <defs>
    <!-- The one drawing of the pot, with its soil. Cell is 320 wide; pot centre x=160. -->
    <g id="gamla-pot">
      <ellipse class="sh" cx="162" cy="613" rx="66" ry="6"/>
      <path class="f-wood" d="M98 492 C122 476 198 476 222 492 Z"/>
      <path class="sh" style="opacity:.4" d="M98 492 C122 476 198 476 222 492 Z"/>
      <path class="d" d="M98 492 C122 476 198 476 222 492"/>
      <path class="f-terracotta o" d="M100 506 L114 604 Q114 610 122 610 L198 610 Q206 610 206 604 L220 506 Z"/>
      <path class="sh" d="M194 508 L220 506 L206 604 Q206 610 198 610 L184 610 Z"/>
      <path class="hl" style="opacity:.25" d="M108 510 L118 510 L128 606 L120 606 Z"/>
      <!-- the white painted band, with two chips and one drip -->
      <path class="f-cotton-white ot" d="M101.400 516 L218.600 516 L216 534 L104 534 Z"/>
      <path class="f-cotton-white ot" d="M167 534 q0 12 3 15 q3 -3 3 -15 Z"/>
      <path class="f-terracotta" d="M131 516.500 l11 0 l4 8 l-6 9 l-9 0 l-3 -9 Z M189 526 l6 -3 l4 6 l-5 4.500 l-6 -2 Z"/>
      <path class="sh" d="M196 516.500 L218.600 516.500 L216 533.500 L193 533.500 Z"/>
      <!-- crack, foot chip, salt bloom -->
      <path class="d" d="M204 508 l-3 9 l4 9 l-5 12 l3 9"/>
      <path class="sh" style="opacity:.35" d="M113 596 l8 4 l-6 6 Z"/>
      <ellipse class="hl" style="opacity:.3" cx="150" cy="598" rx="24" ry="6"/>
      <ellipse class="hl" style="opacity:.3" cx="178" cy="590" rx="12" ry="4"/>
      <!-- rolled rim -->
      <path class="f-terracotta o" d="M92 490 H228 Q232 490 232 494 V504 Q232 508 228 508 H92 Q88 508 88 504 V494 Q88 490 92 490 Z"/>
      <path class="hl" style="opacity:.3" d="M94 493 H190 V496 H94 Z"/>
      <path class="sh" d="M200 491.500 H228 Q230.500 491.500 230.500 494 V504 Q230.500 506.500 228 506.500 H200 Z"/>
    </g>
    <g id="gamla-petal">
      <path class="f-haldi-yellow ot" d="M0 -22 C9 -32 9 -48 0 -58 C-9 -48 -9 -32 0 -22 Z"/>
    </g>
  </defs>

  <g id="state-surajmukhi" data-state="gamla:surajmukhi">
    <!-- the plant is its own group: turn the plant, never the pot. Here it faces screen-right, toward the lane. -->
    <g id="gamla-surajmukhi-plant">
      <path class="n s-outline" stroke-width="10" d="M160 488 C154 440 168 392 166 350"/>
      <path class="n s-leaf-green" stroke-width="6" d="M160 488 C154 440 168 392 166 350"/>
      <path class="f-leaf-green o" d="M158 440 C136 444 112 432 104 410 C128 404 150 414 160 436 Z"/>
      <path class="d" opacity=".5" d="M158 438 C140 432 122 422 108 412"/>
      <path class="f-leaf-green o" d="M164 408 C186 410 210 396 216 372 C192 368 172 382 164 404 Z"/>
      <path class="d" opacity=".5" d="M165 406 C182 398 200 386 212 375"/>
      <g transform="translate(178 322) rotate(14) scale(.72 1)">
        <ellipse class="f-leaf-green o" cx="-20" cy="4" rx="30" ry="40"/>
        <use href="#gamla-petal"/>
        <use href="#gamla-petal" transform="rotate(25.700)"/>
        <use href="#gamla-petal" transform="rotate(51.400)"/>
        <use href="#gamla-petal" transform="rotate(77.100)"/>
        <use href="#gamla-petal" transform="rotate(102.900)"/>
        <use href="#gamla-petal" transform="rotate(128.600)"/>
        <use href="#gamla-petal" transform="rotate(154.300)"/>
        <use href="#gamla-petal" transform="rotate(180)"/>
        <use href="#gamla-petal" transform="rotate(205.700)"/>
        <use href="#gamla-petal" transform="rotate(231.400)"/>
        <use href="#gamla-petal" transform="rotate(257.100)"/>
        <use href="#gamla-petal" transform="rotate(282.900)"/>
        <use href="#gamla-petal" transform="rotate(308.600)"/>
        <use href="#gamla-petal" transform="rotate(334.300)"/>
        <circle class="f-wood o" r="27"/>
        <circle class="sh" style="opacity:.3" r="16"/>
        <path class="d" opacity=".5" d="M-8 -6 h.1 M4 -9 h.1 M9 3 h.1 M-3 8 h.1 M-11 5 h.1 M2 -1 h.1"/>
      </g>
    </g>
    <use href="#gamla-pot"/>
  </g>

  <g id="state-kana-ganna" data-state="gamla:kana-ganna" transform="translate(320 0)">
    <use href="#gamla-pot"/>
    <!-- the length the vendor threw aside: three internodes, about 58 cm, leaning on the pot. The blemish is on the middle internode. -->
    <ellipse class="sh" cx="266" cy="612" rx="22" ry="4"/>
    <path class="cane-o" stroke-width="22" d="M268 606 C262 530 252 450 246 376"/>
    <path class="cane" stroke-width="16" d="M268 604.500 C262 530 252 450 246 377.500"/>
    <path class="sh" d="M270 604 C264 530 254 450 248 378 L254 377 C260 450 270 530 276 604 Z"/>
    <ellipse class="f-paper-cream ot" cx="246" cy="376" rx="9.500" ry="3.500" transform="rotate(-5 246 376)"/>
    <path class="d" d="M252 534 q10 3 20 -1 M246 456 q10 3 20 -1"/>
    <path class="d" opacity=".5" d="M252 538 q10 3 20 -1 M246 460 q10 3 20 -1"/>
    <path class="f-cane-straw ot" d="M254 530 q-7 -6 -3 -12 q6 4 3 12 Z M248 452 q-7 -6 -3 -12 q6 4 3 12 Z"/>
    <ellipse class="f-rust-shawl" cx="262" cy="496" rx="6" ry="10" transform="rotate(-6 262 496)"/>
    <ellipse class="f-soot-black" cx="262" cy="496" rx="2.500" ry="4.500" transform="rotate(-6 262 496)"/>
  </g>

  <g id="state-0-node" data-state="gamla:0-node" transform="translate(640 0)">
    <!-- one node, laid flat and half pressed into the soil, eye upward -->
