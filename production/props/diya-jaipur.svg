<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" data-prop="diya-jaipur">
  <title>जयपुर का दीया — diya-jaipur</title>
  <desc>Hand-thrown clay lamp, Jaipur, 1760s. Shallow bowl 230 wide, pinched spout to the right, cotton wick, soot mark on the spout, potter's thumb dent on the left wall, a nick in the back rim. The flame is the shared one from lau.svg, wick tip at 312,218. States left to right: lit, unlit.</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .sh{fill:#4A2C20;opacity:.16}
    .hl{fill:#FCFAF4;opacity:.5}
    .f-terracotta{fill:#C66B3F}
    .f-brass{fill:#C4932F}
    .f-soot-black{fill:#2A2321}
    .f-flame-core{fill:#FFE9A6}
    .s-outline{stroke:#4A2C20}
    .s-cotton-white{stroke:#FCFAF4}
    .s-soot-black{stroke:#2A2321}
    .c-flame-core{stop-color:#FFE9A6}
    .c-lamp-gold{stop-color:#F5A623}
  </style>
  <defs>
    <radialGradient id="diya-jaipur-fire" cx=".5" cy=".7" r=".62">
      <stop offset="0" class="c-flame-core"/>
      <stop offset=".5" class="c-lamp-gold"/>
      <stop offset="1" class="c-lamp-gold"/>
    </radialGradient>
    <radialGradient id="diya-jaipur-halo">
      <stop offset="0" class="c-lamp-gold" stop-opacity=".5"/>
      <stop offset="1" class="c-lamp-gold" stop-opacity="0"/>
    </radialGradient>
    <!-- The one drawing of the lamp, without flame. -->
    <g id="diya-jaipur-body">
      <ellipse class="sh" cx="190" cy="298" rx="92" ry="7"/>
      <path class="f-terracotta o" d="M90 226 C90 262 118 288 152 294 L224 294 C252 288 270 270 280 246 L320 224 C316 216 300 213 284 217 C262 206 110 206 90 226 Z"/>
      <!-- inside of the bowl, oil, near rim -->
      <path class="f-terracotta" d="M96 226 C116 210 258 210 280 220 L312 221 C300 228 290 232 280 234 C256 246 112 246 96 226 Z"/>
      <path class="sh" style="opacity:.3" d="M96 226 C116 210 258 210 280 220 L312 221 C300 228 290 232 280 234 C256 246 112 246 96 226 Z"/>
      <path class="f-brass" opacity=".9" d="M112 228 C132 218 244 218 262 226 C244 240 132 240 112 228 Z"/>
      <path class="hl" style="opacity:.35" d="M132 226 C150 221 190 220 214 222 C190 224 150 226 132 226 Z"/>
      <path class="d" d="M96 226 C112 246 256 246 280 234 C292 231 304 226 314 222"/>
      <path class="d" d="M92 234 C112 254 256 254 282 240"/>
      <!-- throwing ridges, thumb dent, nick in the back rim -->
      <path class="d" opacity=".6" d="M104 258 C134 280 240 282 268 262 M132 282 C160 290 220 290 246 282"/>
      <ellipse class="sh" cx="120" cy="256" rx="8" ry="13" transform="rotate(-28 120 256)"/>
      <path class="d" d="M136 211 l5 5 l7 -6"/>
      <!-- soot: on the lip and smeared down the outside of the spout -->
      <path class="f-soot-black" opacity=".8" d="M286 232 C298 226 312 222 320 224 C314 236 302 246 286 252 C282 246 282 238 286 232 Z"/>
      <path class="n s-soot-black" stroke-width="4" opacity=".8" d="M290 216 C302 213 316 216 320 224"/>
      <!-- wick -->
      <path class="n s-outline" stroke-width="8" d="M236 229 C264 231 290 227 311 221"/>
      <path class="n s-cotton-white" stroke-width="5" d="M236 229 C264 231 290 227 311 221"/>
      <path class="n s-soot-black" stroke-width="5" d="M303 223 L311 221"/>
    </g>
    <g id="diya-jaipur-lau">
      <circle cx="0" cy="-30" r="76" fill="url(#diya-jaipur-halo)"/>
      <path fill="url(#diya-jaipur-fire)" d="M0 0 C-15 -3 -19 -22 -9 -38 C-4 -46 0 -54 -1 -66 C9 -55 17 -42 17 -26 C17 -12 11 -2 0 0 Z"/>
      <path class="f-flame-core" d="M1 -3 C-7 -5 -9 -15 -4 -23 C-2 -27 1 -31 1 -37 C6 -31 9 -24 9 -16 C9 -9 6 -4 1 -3 Z"/>
    </g>
  </defs>

  <g id="state-lit" data-state="diya-jaipur:lit">
    <use href="#diya-jaipur-body"/>
    <use href="#diya-jaipur-lau" transform="translate(312 218) scale(1.25)"/>
  </g>

  <g id="state-unlit" data-state="diya-jaipur:unlit" transform="translate(400 0)">
    <use href="#diya-jaipur-body"/>
  </g>
</svg>
