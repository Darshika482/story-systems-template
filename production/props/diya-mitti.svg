<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" data-prop="diya-mitti">
  <title>छोटा मिट्टी का दीया — the small clay lamps</title>
  <desc>The plain small clay lamp that is lit from घर का दीया in the power cut (scene 5.5: six of them on a steel plate, one for each hand) and set out on दिवाली (scene 7.4). No soot mark, no wear: these are new every year, and that is the point. The flame is the shared one from lau.svg at scale 1, wick tip at 252,238. States left to right: lit, unlit.</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .sh{fill:#4A2C20;opacity:.16}
    .hl{fill:#FCFAF4;opacity:.5}
    .f-terracotta{fill:#C66B3F}
    .f-brass{fill:#C4932F}
    .f-flame-core{fill:#FFE9A6}
    .s-outline{stroke:#4A2C20}
    .s-cotton-white{stroke:#FCFAF4}
    .s-soot-black{stroke:#2A2321}
    .c-flame-core{stop-color:#FFE9A6}
    .c-lamp-gold{stop-color:#F5A623}
  </style>
  <defs>
    <radialGradient id="diya-mitti-fire" cx=".5" cy=".7" r=".62">
      <stop offset="0" class="c-flame-core"/>
      <stop offset=".5" class="c-lamp-gold"/>
      <stop offset="1" class="c-lamp-gold"/>
    </radialGradient>
    <radialGradient id="diya-mitti-halo">
      <stop offset="0" class="c-lamp-gold" stop-opacity=".5"/>
      <stop offset="1" class="c-lamp-gold" stop-opacity="0"/>
    </radialGradient>
    <g id="diya-mitti-body">
      <ellipse class="sh" cx="196" cy="288" rx="56" ry="5"/>
      <path class="f-terracotta o" d="M138 242 C138 266 158 284 176 286 L212 286 C226 282 236 270 240 256 L258 242 C254 236 244 235 236 238 C220 230 152 230 138 242 Z"/>
      <path class="sh" style="opacity:.3" d="M144 242 C158 232 220 232 234 240 L252 240 C246 246 240 248 234 250 C218 258 156 258 144 242 Z"/>
      <path class="f-brass" opacity=".9" d="M156 244 C168 238 212 238 222 243 C212 252 168 252 156 244 Z"/>
      <path class="d" d="M144 242 C156 258 218 258 234 250 C242 247 248 244 254 241"/>
      <path class="hl" style="opacity:.25" d="M146 256 C150 268 160 276 170 280 C160 272 154 264 152 256 Z"/>
      <path class="n s-outline" stroke-width="7" stroke-linecap="round" d="M210 246 C226 248 240 244 251 240"/>
      <path class="n s-cotton-white" stroke-width="4" stroke-linecap="round" d="M210 246 C226 248 240 244 251 240"/>
      <path class="n s-soot-black" stroke-width="4" stroke-linecap="round" d="M246 242 L251 240"/>
    </g>
    <g id="diya-mitti-lau">
      <circle cx="0" cy="-30" r="76" fill="url(#diya-mitti-halo)"/>
      <path fill="url(#diya-mitti-fire)" d="M0 0 C-15 -3 -19 -22 -9 -38 C-4 -46 0 -54 -1 -66 C9 -55 17 -42 17 -26 C17 -12 11 -2 0 0 Z"/>
      <path class="f-flame-core" d="M1 -3 C-7 -5 -9 -15 -4 -23 C-2 -27 1 -31 1 -37 C6 -31 9 -24 9 -16 C9 -9 6 -4 1 -3 Z"/>
    </g>
  </defs>

  <g id="state-lit" data-state="diya-mitti:lit">
    <use href="#diya-mitti-body"/>
    <use href="#diya-mitti-lau" transform="translate(252 238)"/>
  </g>

  <g id="state-unlit" data-state="diya-mitti:unlit" transform="translate(400 0)">
    <use href="#diya-mitti-body"/>
  </g>
</svg>
