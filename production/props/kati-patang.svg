<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" data-prop="kati-patang">
  <title>कटी पतंग — आँखदार, गुलाबी-पीली</title>
  <desc>Paper fighter kite cut loose on संक्रांति 2027. Diamond 244 wide by 260 tall, pink on the screen-left half, yellow on the screen-right half, one round eye on each half in the other colour, bamboo spine and bow, white paper tabs at three corners, a two-colour tail. Wear: a V-shaped tear in the lower screen-right edge near the tail, and a short length of plain white cotton string with a frayed end. States left to right: flat (construction), drifting, tied (to the balcony grill), 2028 (the kite that lands a year later: same pattern, colours mirrored, no tear).</desc>
  <style>
    .o{stroke:#4A2C20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .ot{stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .d{fill:none;stroke:#4A2C20;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:none}
    .f-kite-pink{fill:#EF6FA1}
    .f-haldi-yellow{fill:#EDB82F}
    .f-cotton-white{fill:#FCFAF4}
    .s-outline{stroke:#4A2C20}
    .s-cotton-white{stroke:#FCFAF4}
    .s-soot-black{stroke:#2A2321}
    .string-o{fill:none;stroke:#4A2C20;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .string{fill:none;stroke:#FCFAF4;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <!-- The one drawing of the 2027 kite, without string. Corners: top 200,52; right 322,176; bottom 200,312; left 78,176. -->
    <g id="kati-patang-2027">
      <path class="f-haldi-yellow o" d="M200 298 L178 350 L200 350 Z"/>
      <path class="f-kite-pink o" d="M200 298 L222 350 L200 350 Z"/>
      <path class="f-kite-pink o" d="M200 52 L78 176 L200 312 Z"/>
      <!-- the tear: a V cut into the lower right edge -->
      <path class="f-haldi-yellow o" d="M200 52 L322 176 L248.800 257.600 L220.400 244.400 L236.600 271.200 L200 312 Z"/>
      <path class="d" d="M220.400 244.400 l-7 -5 M220.400 244.400 l-2 -8"/>
      <!-- eyes -->
      <circle class="f-haldi-yellow ot" cx="158" cy="168" r="22"/>
      <circle class="f-cotton-white ot" cx="158" cy="168" r="8"/>
      <circle class="f-kite-pink ot" cx="242" cy="168" r="22"/>
      <circle class="f-cotton-white ot" cx="242" cy="168" r="8"/>
      <!-- bamboo: spine and bow; paper tabs -->
      <path class="d" stroke-width="2.2" d="M200 52 V350 M78 176 Q200 40 322 176"/>
      <path class="d" opacity=".3" d="M216 118 L290 198"/>
      <path class="f-cotton-white ot" d="M200 52 L188 66 H212 Z M78 176 L92 164 V188 Z M322 176 L308 164 V188 Z"/>
      <circle class="f-cotton-white ot" cx="200" cy="172" r="3.500"/>
    </g>
    <!-- 2028: the same pattern mirrored, whole -->
    <g id="kati-patang-2028">
      <path class="f-kite-pink o" d="M200 298 L178 350 L200 350 Z"/>
      <path class="f-haldi-yellow o" d="M200 298 L222 350 L200 350 Z"/>
      <path class="f-haldi-yellow o" d="M200 52 L78 176 L200 312 Z"/>
      <path class="f-kite-pink o" d="M200 52 L322 176 L200 312 Z"/>
      <circle class="f-kite-pink ot" cx="158" cy="168" r="22"/>
      <circle class="f-cotton-white ot" cx="158" cy="168" r="8"/>
      <circle class="f-haldi-yellow ot" cx="242" cy="168" r="22"/>
      <circle class="f-cotton-white ot" cx="242" cy="168" r="8"/>
      <path class="d" stroke-width="2.2" d="M200 52 V350 M78 176 Q200 40 322 176"/>
      <path class="f-cotton-white ot" d="M200 52 L188 66 H212 Z M78 176 L92 164 V188 Z M322 176 L308 164 V188 Z"/>
      <circle class="f-cotton-white ot" cx="200" cy="172" r="3.500"/>
    </g>
  </defs>

  <g id="state-flat" data-state="patang:flat">
    <use href="#kati-patang-2027"/>
    <path class="string-o" d="M200 172 C182 214 150 250 122 292 C106 316 98 336 104 364 M104 364 l-5 8 M104 364 l1 10 M104 364 l7 7"/>
    <path class="string" d="M200 172 C182 214 150 250 122 292 C106 316 98 336 104 364 M104 364 l-5 8 M104 364 l1 10 M104 364 l7 7"/>
  </g>

  <g id="state-drifting" data-state="patang:drifting" transform="translate(400 0)">
    <use href="#kati-patang-2027" transform="rotate(-24 200 190)"/>
    <path class="string-o" d="M192.700 173.600 C230 152 248 112 288 98 C320 87 340 62 368 44 M368 44 l9 -3 M368 44 l6 -8 M368 44 l1 -10"/>
    <path class="string" d="M192.700 173.600 C230 152 248 112 288 98 C320 87 340 62 368 44 M368 44 l9 -3 M368 44 l6 -8 M368 44 l1 -10"/>
  </g>

  <g id="state-tied" data-state="patang:tied" transform="translate(800 0)">
    <!-- balcony grill (location L3, not part of the kite) -->
    <path class="n s-soot-black" stroke-width="6" stroke-linecap="round" d="M96 44 V396 M200 44 V396 M304 44 V396"/>
    <path class="n s-soot-black" stroke-width="10" stroke-linecap="round" d="M20 44 H380"/>
    <use href="#kati-patang-2027" transform="translate(14 28) rotate(12 200 190)"/>
    <path class="string-o" d="M217.700 200.400 C226 156 240 104 236 52 M236 52 q9 10 4 24"/>
    <path class="string" d="M217.700 200.400 C226 156 240 104 236 52 M236 52 q9 10 4 24"/>
    <ellipse class="n s-outline" stroke-width="5" cx="236" cy="44" rx="5" ry="9"/>
    <ellipse class="n s-cotton-white" stroke-width="2.500" cx="236" cy="44" rx="5" ry="9"/>
  </g>

  <g id="state-2028" data-state="patang:2028" transform="translate(1200 0)">
    <use href="#kati-patang-2028" transform="rotate(22 200 190)"/>
    <path class="string-o" d="M206.700 173.300 C170 152 152 112 112 98 C80 87 60 62 32 44 M32 44 l-9 -3 M32 44 l-6 -8 M32 44 l-1 -10"/>
    <path class="string" d="M206.700 173.300 C170 152 152 112 112 98 C80 87 60 62 32 44 M32 44 l-9 -3 M32 44 l-6 -8 M32 44 l-1 -10"/>
  </g>
</svg>
